[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layernav_android"
version = "0.1.0"
description = "Multi-layer task-stack navigation framework for Android ADB automation. Define N layers, register per-layer handlers, and let the framework handle BACK recovery, cold-start, and cross-layer verification."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "android",
    "adb",
    "automation",
    "python",
    "crawler",
    "app-crawler",
    "mobile-rpa",
    "navigation",
    "fault-tolerance",
    "layer-model",
    "data-collection",
    "task-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
wechat = ["opencv-python>=4.8", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/yuyidream/layernav_android"

[tool.hatch.build.targets.wheel]
packages = ["src/layernav_android"]
